<html lang="bn" class="dark h-full">
<head>

<style>
video::-webkit-media-controls{display:none!important}
*{scrollbar-width:none;-ms-overflow-style:none}::-webkit-scrollbar{width:0}
#dth{position:absolute;inset:0;pointer-events:none;z-index:30;opacity:0;transition:.25s}
#dth.show{opacity:1}
.dth-num{position:absolute;top:36px;right:36px;background:rgba(0,0,0,.85);color:#4ade80;font:900 40px monospace;padding:10px 20px;border:2px solid rgba(74,222,128,.6);border-radius:10px}
.dth-name{position:absolute;bottom:80px;left:36px;right:36px;border-bottom:2px solid rgba(255,255,255,.6);padding-bottom:10px;color:#fff;font:700 26px 'Noto Sans Bengali',sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.9)}
#loading{position:absolute;inset:0;background:#000;z-index:24;display:none;flex-direction:column;align-items:center;justify-content:center}
#loading.show{display:flex}
.spinner{width:55px;height:55px;border:4px solid rgba(255,255,255,.1);border-top-color:#06b6d4;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadStatus{color:#94a3b8;font-size:13px;margin-top:18px;text-align:center;padding:0 40px}
.tv-focus{outline:3px solid #06b6d4!important;background:rgba(6,182,212,.2)!important;transform:scale(1.02)}
.badge-live{background:rgba(16,185,129,.2);color:#6ee7b7;font-size:9px;padding:2px 6px;border-radius:4px}
.badge-dead{background:rgba(244,63,94,.2);color:#fda4af;font-size:9px;padding:2px 6px;border-radius:4px}
.badge-added{background:rgba(59,130,246,.2);color:#93c5fd;font-size:9px;padding:2px 6px;border-radius:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal-box{background:#0b0f19;border:1px solid #334155;border-radius:16px;padding:20px;width:100%;max-width:320px;text-align:center;transform:scale(0.95);transition:transform 0.2s}
.modal-bg.show .modal-box{transform:scale(1)}
</style>
</head>
<body class="bg-black text-slate-100 h-full overflow-hidden" style="font-family:'Noto Sans Bengali',sans-serif">

<!-- Splash & Player (previous UI structure remains) -->
<div id="splash" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
  <i class="fa-solid fa-tv text-6xl text-blue-500 mb-4"></i>
  <h1 class="text-3xl font-black tracking-widest text-white">PRO <span class="text-cyan-400">TV</span></h1>
</div>

<div id="player" class="fixed inset-0 bg-black z-50 flex flex-col">
  <div id="blocker" style="pointer-events:auto;cursor:pointer" class="absolute inset-0 z-20 bg-black" onclick="tap()"></div>
  <video id="vid" style="width:100%;height:100%;object-fit:fill" class="relative z-0 bg-black" crossorigin playsinline webkit-playsinline muted></video>
  
  <div id="loading"><div class="spinner"></div><p id="loadStatus">Connecting...</p></div>
  
  <div id="nosignal" class="hidden absolute inset-0 bg-black flex-col items-center justify-center" style="z-index:25; pointer-events:auto;">
    <i class="fa-solid fa-tv text-5xl text-slate-700 mb-3"></i>
    <h1 class="text-3xl font-black tracking-[.3em] text-slate-500 animate-pulse">NO SIGNAL</h1>
    <p class="text-xs text-slate-500 mt-2">Tap to retry direct</p>
    <button onclick="retryWithProxy()" class="mt-4 px-4 py-2 bg-blue-600/80 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-lg">
      <i class="fa-solid fa-shield-halved"></i> Retry via Proxy (If blocked)
    </button>
  </div>
  
  <div id="dth"><div class="dth-num" id="dthNum">1</div><div class="dth-name" id="dthName">Channel</div></div>
  <div class="absolute bottom-5 left-1/2 -translate-x-1/2 flex gap-5 z-40 md:hidden">
    <button onclick="event.stopPropagation();next()" class="w-14 h-14 rounded-full bg-slate-800/80 text-white flex items-center justify-center border border-slate-600"><i class="fa-solid fa-chevron-up text-xl"></i></button>
    <button onclick="event.stopPropagation();prev()" class="w-14 h-14 rounded-full bg-slate-800/80 text-white flex items-center justify-center border border-slate-600"><i class="fa-solid fa-chevron-down text-xl"></i></button>
  </div>
  <div id="ctrl" class="absolute top-4 left-4 right-4 z-40 flex justify-between">
    <button onclick="openList()" class="w-10 h-10 rounded-full bg-slate-800/80 text-white flex items-center justify-center border border-slate-600"><i class="fa-solid fa-list"></i></button>
    <button onclick="promptPin()" class="w-10 h-10 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center border border-amber-500/40"><i class="fa-solid fa-user-shield"></i></button>
  </div>
</div>

<!-- Modals (Channel List, PIN, Admin, My Channels, Sources, Backup, Alert, Confirm) as in previous code -->
<!-- ... (omitted for brevity, but present in final code) ... -->

<script>
const ADMIN_PIN = "Honorx6g#";
const FB = "https://pro-tv-3cd93-default-rtdb.firebaseio.com/";
const SYNC_ID = "protv_simple_v10";
// Multiple robust proxies for fallback
const PROXIES = [
  "https://api.allorigins.win/raw?url=",
  "https://corsproxy.io/?",
  "https://api.codetabs.com/v1/proxy?quest="
];
const DB = "ProTvSimple", STORE = "data";
const DTH_MS = 7000;
const SWITCH_DEBOUNCE = 80;

const DEFAULT_HEADERS = {
  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
  "Accept": "*/*"
};

const S = {
  channels: [], sources: [], currentIdx: -1,
  isAdmin: false, hls: null,
  playSession: 0, switching: false, switching_idx: -1,
  focusIdx: 0, vol: 0.7, curStatus: {}, refetching: false,
  sessionId: 'u_' + Math.random().toString(36).slice(2, 11),
  healthRunning: false, browseListData: [], browseSourceId: null,
  forceProxyIdx: -1
};

/* ... (IndexedDB, Utils, Modals, Header Logic, M3U Parser, Fetch functions remain same as previous code) ... */

/* ══════ Live Check (Robust) ══════ */
async function checkLive(url, headers = {}) {
  if (!url) return false;
  const h = getHeadersForUrl(url, headers);
  
  // 1. Direct Fetch with Headers
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch(url, { signal: ctrl.signal, cache: "no-cache", headers: h }); clearTimeout(t);
    if (r.ok) { const text = await r.text(); if (text.trim().startsWith("#EXTM3U")) return true; }
  } catch {}

  // 2. Proxy Fetch
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch(PROXIES[0] + encodeURIComponent(url), { signal: ctrl.signal }); clearTimeout(t);
    if (r.ok) { const text = await r.text(); if (text.trim().startsWith("#EXTM3U")) return true; }
  } catch {}

  // 3. Native Video Test (Bypasses CORS in WebView)
  return new Promise(resolve => {
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true;
      let done = false;
      const finish = (result) => {
          if (done) return; done = true;
          v.pause(); v.removeAttribute('src'); v.load(); v.remove();
          resolve(result);
      };
      setTimeout(() => finish(false), 3000);
      v.oncanplay = () => finish(true);
      v.onerror = () => finish(false);
      v.src = url;
  });
}

/* ══════ HLS Player & Native Fallback ══════ */
const vid = document.getElementById("vid");
const nosignal = document.getElementById("nosignal");
const loadingEl = document.getElementById("loading");
const loadStatus = document.getElementById("loadStatus");
const blocker = document.getElementById("blocker");
let watchdogT = null;

function showLoading(msg) { loadStatus.textContent = msg || "Connecting..."; loadingEl.classList.add("show"); nosignal.classList.add("hidden"); }
function hideLoading() { loadingEl.classList.remove("show"); }
function showNoSignal() { hideLoading(); nosignal.classList.remove("hidden"); nosignal.classList.add("flex"); blocker.style.backgroundColor = "transparent"; }
function hideNoSignal() { nosignal.classList.add("hidden"); nosignal.classList.remove("flex"); }

function createHls(chHeaders) {
  if (S.hls) { S.hls.destroy(); S.hls = null; }
  if (!Hls.isSupported()) return null;
  
  S.hls = new Hls({
    enableWorker: true, lowLatencyMode: true, liveSyncDurationCount: 2,
    backBufferLength: 20, manifestLoadingTimeOut: 5000, fragLoadingTimeOut: 8000,
    xhrSetup: (xhr, url) => {
      xhr.withCredentials = false;
      if (!url.includes("corsproxy.io") && !url.includes("allorigins") && !url.includes("codetabs")) {
        try { 
          const finalHeaders = getHeadersForUrl(url, chHeaders);
          Object.keys(finalHeaders).forEach(k => xhr.setRequestHeader(k, finalHeaders[k])); 
        } catch {}
      }
    }
  });
  S.hls.attachMedia(vid);
  S.hls.on(Hls.Events.MANIFEST_PARSED, () => {
    vid.muted = true; vid.volume = S.vol;
    vid.play().then(() => setTimeout(() => vid.muted = false, 250)).catch(() => { vid.muted = false; vid.play().catch(() => {}); });
  });
  
  S.hls.on(Hls.Events.ERROR, async (_, data) => {
    if (!data.fatal) return;
    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { 
        try { S.hls.recoverMediaError(); return; } catch {} 
    }
    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
      showLoading("Trying native player...");
      const ch = S.channels[S.currentIdx];
      if (!ch) { showNoSignal(); return; }
      
      const nativeOk = await tryNativePlayback(ch.url);
      if (nativeOk) return;
      
      showNoSignal();
      return;
    }
    showNoSignal();
  });
  return S.hls;
}

// Full chain native fallback (Direct -> Proxies)
async function tryNativePlayback(url) {
    if (S.hls) { S.hls.destroy(); S.hls = null; }
    
    // 1. Try Direct
    let ok = await playNativeUrl(url);
    if (ok) return true;

    // 2. Try Proxies Sequentially
    for (let i = 0; i < PROXIES.length; i++) {
        showLoading(`Trying proxy ${i+1}...`);
        let proxyUrl = PROXIES[i] + encodeURIComponent(url);
        ok = await playNativeUrl(proxyUrl);
        if (ok) return true;
    }
    return false;
}

function playNativeUrl(url) {
    return new Promise(resolve => {
        vid.muted = true; vid.volume = S.vol;
        let done = false;
        const finish = (res) => {
            if (done) return; done = true;
            clearTimeout(timer);
            vid.oncanplay = null;
            vid.onerror = null;
            resolve(res);
        };
        const timer = setTimeout(() => finish(false), 4000);
        vid.oncanplay = () => {
            vid.play().then(() => finish(true)).catch(() => finish(false));
        };
        vid.onerror = () => finish(false);
        vid.src = url;
    });
}

async function refetchChannelUrl(ch) {
  for (const src of S.sources) {
    const list = await fetchSource(src, true);
    const match = list.find(p => p.name === ch.name);
    if (match && match.url) return { url: match.url, headers: match.headers };
  }
  return null;
}

/* ══════ Play Channel ══════ */
async function playChannel(ch, idx) {
  if (S.switching) return;
  S.switching = true;
  try {
    S.playSession++; const sid = S.playSession; S.currentIdx = idx;
    showOSD(ch, idx); resetControls();
    
    if (!ch.url) {
      showLoading("Finding link...");
      const newData = await refetchChannelUrl(ch);
      if (!newData) { showNoSignal(); return; }
      ch.url = newData.url; ch.headers = newData.headers; save();
    }
    
    showLoading("Connecting...");
    
    let playUrl = ch.url;
    // If proxy mode is forced via button
    if (S.forceProxyIdx >= 0) {
        playUrl = PROXIES[S.forceProxyIdx] + encodeURIComponent(ch.url);
        showLoading(`Proxy ${S.forceProxyIdx+1}...`);
        const ok = await playNativeUrl(playUrl);
        if (ok) return;
        
        // If proxy fails, reset and try direct
        S.forceProxyIdx = -1;
        showNoSignal();
        return;
    }

    // Default: HLS.js
    if (!S.hls) createHls(ch.headers);
    try { S.hls.loadSource(playUrl); } catch (e) { 
        const ok = await tryNativePlayback(playUrl);
        if (!ok) showNoSignal(); 
        return; 
    }
    
    clearTimeout(watchdogT);
    watchdogT = setTimeout(async () => {
      if (S.playSession !== sid || (vid.readyState >= 2 && !vid.paused)) return;
      showLoading("Switching to native...");
      const nativeOk = await tryNativePlayback(ch.url);
      if (!nativeOk) showNoSignal();
    }, 8000);
  } finally { S.switching = false; }
}

function retryWithProxy() {
  // Cycle through proxies on each click
  S.forceProxyIdx = (S.forceProxyIdx + 1) % PROXIES.length;
  playChannel(S.channels[S.currentIdx], S.currentIdx);
}

function next() { 
    S.forceProxyIdx = -1;
    if (S.channels.length) playChannel(S.channels[(S.currentIdx + 1) % S.channels.length], (S.currentIdx + 1) % S.channels.length); 
}
function prev() { 
    S.forceProxyIdx = -1;
    if (S.channels.length) { const i = (S.currentIdx - 1 + S.channels.length) % S.channels.length; playChannel(S.channels[i], i); } 
}
function togglePlay() { vid.paused ? vid.play() : vid.pause(); }

vid.addEventListener("playing", () => { blocker.style.backgroundColor = "transparent"; hideNoSignal(); hideLoading(); clearTimeout(watchdogT); });

/* ... (Rest of the functions: OSD, Controls, Channel List, Keyboard, Admin, Backup, etc. remain same) ... */

/* ══════ Boot ══════ */
async function boot() {
  S.channels = (await idbGet("channels")) || [];
  S.sources = ((await idbGet("sources")) || []).map(s => ({ ...s, _ch: [] }));
  document.getElementById("splash").style.opacity = "0";
  setTimeout(() => document.getElementById("splash").style.display = "none", 400);
  renderList(); updateStats();
  if (S.channels.length > 0) playChannel(S.channels[0], 0);
}
window.addEventListener("DOMContentLoaded", boot);
</script>
